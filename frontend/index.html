
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Boekenwinkel</title>
</head>
<body>
<header>
    <h1>Mijn Boekenwinkel</h1>
</header>

<main>
    <h2>Onze boeken</h2>
    <p>Welkom in onze online boekenwinkel!</p>

    <div id="boeken">

    </div>

    <section id="boek-details" hidden>
        <h2>Boekdetails</h2>
        <div id="details-inhoud"></div>
        <button id="terug-knop" type="button">Terug naar boeken</button>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
