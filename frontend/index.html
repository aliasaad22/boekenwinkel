
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Boekenwinkel</title>
</head>
<body>
<header>
    <h1>Mijn Boekenwinkel</h1>
</header>

<main>
    <section id="registratie">
        <h2>Account aanmaken</h2>

        <form id="registratie-formulier">
            <label for="registratie-naam">Naam:</label>
            <input
                    type="text"
                    id="registratie-naam"
                    name="name"
                    required
            >

            <label for="registratie-email">E-mailadres:</label>
            <input
                    type="email"
                    id="registratie-email"
                    name="email"
                    required
            >

            <label for="registratie-wachtwoord">Wachtwoord:</label>
            <input
                    type="password"
                    id="registratie-wachtwoord"
                    name="password"
                    required
            >

            <button type="submit">Registreren</button>
        </form>

        <p id="registratie-bericht"></p>

        <section id="login">
            <h2>Inloggen</h2>

            <form id="login-formulier">
                <label for="login-email">E-mailadres:</label>
                <input
                        type="email"
                        id="login-email"
                        name="email"
                        required
                >

                <label for="login-wachtwoord">Wachtwoord:</label>
                <input
                        type="password"
                        id="login-wachtwoord"
                        name="password"
                        required
                >

                <button type="submit">Inloggen</button>
            </form>

            <p id="login-bericht"></p>
            <p id="gebruiker-status" hidden></p>

            <button id="uitlog-knop" type="button" hidden>
                Uitloggen
            </button>
        </section>

    </section>

    <h2>Onze boeken</h2>
    <p>Welkom in onze online boekenwinkel!</p>

    <div id="boeken">
        <p>Boeken laden...</p>
    </div>

    <section id="boek-details" hidden>
        <h2>Boekdetails</h2>
        <div id="details-inhoud"></div>
        <button id="terug-knop" type="button">Terug naar boeken</button>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
